dimension: 1
name: "Burgers 1D Control"
problem:
  nu: 0.0318309886  # 0.1 / pi
  ic_preset: "b1d_control"
  x_min: -1.0
  x_max: 1.0
  t_max: 1.0
model:
  type: "ff"
  layers: 6
  width: 128
  fourier_sigma: 3.0
  fourier_size: 128
  activation: "tanh"
ri:
  threshold_pct: 30.0
  period: 2000
  duration: 500
  lambda_ri: 1.0
  lambda_bc: 5.0
  lambda_ic: 1.0
  detect_variant: 1
training:
  seed: 0
  n_colloc: 10000
  n_bc: 1000
  n_ic: 1000
  lr_phase1: 5.0e-5
  lr_phase2: 5.0e-6
  max_epochs_phase1: 8000
  max_epochs_phase2: 4000
  patience: 2500
  seeds: [0, 1, 2]

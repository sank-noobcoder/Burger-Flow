dimension: 2
name: "Cavity Flow Re 1000"
problem:
  reynolds: 1000
  ic_preset: "lid_driven_cavity"
  t_max: 1.0
model:
  type: "ri"
  layers: 6
  width: 128
  fourier_sigma: 3.0
  fourier_size: 128
  activation: "tanh"
ri:
  threshold_pct: 30.0
  period: 2000

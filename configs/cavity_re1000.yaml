  lambda_ri: 1.0
  lambda_bc: 5.0
  detect_variant: 2
training:
  seed: 0
  n_colloc: 20000
  n_bc: 4000
  lr_phase1: 5.0e-5
  lr_phase2: 5.0e-6
  max_epochs_phase1: 15000
  max_epochs_phase2: 5000
  patience: 3000

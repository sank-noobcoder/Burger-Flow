version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=burgersflow-production-super-secret-key-change-in-prod
      - DATABASE_URL=postgresql://burgers:flowpass@postgres:5432/burgersflow
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACTS_DIR=/app/artifacts_storage
    volumes:
      - artifacts_data:/app/artifacts_storage
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://burgers:flowpass@postgres:5432/burgersflow
      - REDIS_URL=redis://redis:6379/0
      - ARTIFACTS_DIR=/app/artifacts_storage
    volumes:
      - artifacts_data:/app/artifacts_storage
    depends_on:
      - api
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=burgers
      - POSTGRES_PASSWORD=flowpass
      - POSTGRES_DB=burgersflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  artifacts_data:
  pg_data:
